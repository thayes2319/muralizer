// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Compatibility shim: some tooling still invokes
// :capacitor-cordova-android-plugins:testClasses, but AGP 8 library
// modules may not expose that legacy task.
gradle.projectsEvaluated {
    def cordovaPluginsProject = rootProject.findProject(":capacitor-cordova-android-plugins")
    if (cordovaPluginsProject && !cordovaPluginsProject.tasks.findByName("testClasses")) {
        cordovaPluginsProject.tasks.register("testClasses") {
            group = "verification"
            description = "Compatibility placeholder for legacy testClasses task invocations."
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
